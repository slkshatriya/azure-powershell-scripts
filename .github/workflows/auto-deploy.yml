name: Auto Deploy to Azure (CLI Method)

on:
  push:
    branches: [ main ]
    paths: [ 'scripts/**' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Azure CLI
      run: |
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        az --version
    
    - name: Login to Azure with Token
      run: |
        # Create temporary credentials file
        echo "${{ secrets.AZURE_ACCESS_TOKEN }}" > /tmp/token.txt
        
        # Login using access token method
        az login --service-principal \
          --username "00000000-0000-0000-0000-000000000000" \
          --password "${{ secrets.AZURE_ACCESS_TOKEN }}" \
          --tenant "${{ secrets.AZURE_TENANT_ID }}" \
          --allow-no-subscriptions || echo "Method 1 failed, trying alternative..."
        
        # Set subscription
        az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        
        echo "Azure CLI authenticated"
    
    - name: Deploy Scripts using Azure CLI
      run: |
        echo "Deploying scripts using Azure CLI..."
        
        for script_file in scripts/*.ps1; do
          if [[ -f "$script_file" ]]; then
            runbook_name=$(basename "$script_file" .ps1)
            echo "Deploying: $runbook_name"
            
            # Delete existing runbook (if exists)
            echo "  Cleaning up existing runbook..."
            az automation runbook delete \
              --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$runbook_name" \
              --yes 2>/dev/null || echo "  No existing runbook to delete"
            
            # Create new runbook
            echo "  Creating runbook..."
            az automation runbook create \
              --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$runbook_name" \
              --type "PowerShell" \
              --description "Auto-deployed from GitHub on $(date)"
            
            # Upload content
            echo "  Uploading content..."
            az automation runbook replace-content \
              --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$runbook_name" \
              --content "@$script_file"
            
            # Publish runbook
            echo "  Publishing..."
            az automation runbook publish \
              --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$runbook_name"
            
            echo "Successfully deployed: $runbook_name"
          fi
        done
        
        echo "All scripts deployed successfully!"
    
    - name: List Deployed Runbooks
      run: |
        echo "Current runbooks:"
        az automation runbook list \
          --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --query "[].{Name:name, State:state, Type:runbookType}" \
          --output table
