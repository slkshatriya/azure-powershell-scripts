name: Deploy (Minimal Module Loading)

on:
  push:
    branches: [ main ]
    paths: [ 'scripts/**' ]

jobs:
  deploy:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache and Setup Azure PowerShell
      uses: actions/cache@v3
      id: cache-azmodule
      with:
        path: |
          C:\Users\runneradmin\Documents\PowerShell\Modules\Az*
          C:\Program Files\PowerShell\Modules\Az*
        key: azure-powershell-${{ runner.os }}-v3
    
    - name: One-Time Setup (Only if not cached)
      if: steps.cache-azmodule.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Write-Host "First-time setup (cached for future runs)..."
        Install-Module -Name Az.Accounts, Az.Automation -Force -Scope CurrentUser -AllowClobber
        Import-Module Az.Accounts, Az.Automation -Force
        Write-Host "Setup complete and cached"
    
    - name: Deploy Scripts (Skip Import if Cached)
      shell: pwsh
      run: |
        # Only import if modules aren't already loaded or cached
        if (-not (Get-Module Az.Automation)) {
            Write-Host "Loading cached modules..."
            Import-Module Az.Accounts, Az.Automation -Force
        } else {
            Write-Host "Modules already loaded"
        }
        
        Write-Host "Connecting to Azure..."
        Connect-AzAccount -AccessToken "${{ secrets.AZURE_ACCESS_TOKEN }}" -SubscriptionId "${{ secrets.AZURE_SUBSCRIPTION_ID }}" -AccountId "automation@github.com"
        
        Write-Host "Deploying scripts..."
        $resourceGroup = "${{ secrets.AZURE_RESOURCE_GROUP }}"
        $automationAccount = "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}"
        
        Get-ChildItem -Path "scripts/*.ps1" | ForEach-Object {
            $runbookName = $_.BaseName
            Write-Host "Processing: $runbookName"
            
            Remove-AzAutomationRunbook -ResourceGroupName $resourceGroup -AutomationAccountName $automationAccount -Name $runbookName -Force -ErrorAction SilentlyContinue
            Import-AzAutomationRunbook -ResourceGroupName $resourceGroup -AutomationAccountName $automationAccount -Name $runbookName -Type PowerShell -Path $_.FullName -Published
            
            Write-Host "SUCCESS: $runbookName published!"
        }
        
        Write-Host "All done!"
