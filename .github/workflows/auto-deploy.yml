name: Deploy Scripts to Azure (Fixed Authentication)

on:
  push:
    branches: [ main ]
    paths: [ 'scripts/**' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Get code
      uses: actions/checkout@v4
    
    - name: Install Azure CLI
      run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    
    - name: Login to Azure (Automated)
      run: |
        # Use access token to login without manual intervention
        az login --service-principal \
          --username "16c866e9-f2ee-472f-ae80-006543691b2d" \
          --password "${{ secrets.AZURE_ACCESS_TOKEN }}" \
          --tenant "${{ secrets.AZURE_TENANT_ID }}"
        
        az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        echo "✅ Logged in successfully (automated)"
    
    - name: Deploy PowerShell Scripts
      run: |
        echo "🚀 Deploying scripts..."
        
        for script in scripts/*.ps1; do
          if [[ -f "$script" ]]; then
            name=$(basename "$script" .ps1)
            echo "📦 Deploying: $name"
            
            # Delete old runbook
            az automation runbook delete \
              --automation-account-name ${{ secrets.AZURE_AUTOMATION_ACCOUNT }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name "$name" --yes 2>/dev/null || echo "No existing runbook"
            
            # Create new runbook
            az automation runbook create \
              --automation-account-name ${{ secrets.AZURE_AUTOMATION_ACCOUNT }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name "$name" \
              --type PowerShell \
              --description "Auto-deployed from GitHub"
            
            # Upload content
            az automation runbook replace-content \
              --automation-account-name ${{ secrets.AZURE_AUTOMATION_ACCOUNT }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name "$name" \
              --content "@$script"
            
            # Publish
            az automation runbook publish \
              --automation-account-name ${{ secrets.AZURE_AUTOMATION_ACCOUNT }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name "$name"
            
            echo "✅ Successfully deployed and published: $name"
          fi
        done
        
        echo "🎉 All scripts deployed and published!"
    
    - name: Verify Deployment
      run: |
        echo "📋 Verifying all runbooks..."
        az automation runbook list \
          --automation-account-name ${{ secrets.AZURE_AUTOMATION_ACCOUNT }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query "[].{Name:name,State:state,Type:runbookType}" \
          --output table
