name: Deploy Scripts to Azure (Fully Automated)

on:
  push:
    branches: [ main ]
    paths: [ 'scripts/**' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Azure CLI
      run: |
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        az --version
    
    - name: Authenticate with Azure (Token Method)
      run: |
        echo "🔐 Setting up Azure authentication..."
        
        # Method 1: Try token-based auth
        export AZURE_ACCESS_TOKEN="${{ secrets.AZURE_ACCESS_TOKEN }}"
        
        # Create a temporary Azure context using the token
        az account clear
        
        # Set subscription using token
        az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" 2>/dev/null || {
          echo "Token method failed, trying alternative..."
          
          # Method 2: Use REST API to verify token and set context
          TOKEN_INFO=$(curl -s -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}" \
            "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}?api-version=2020-01-01")
          
          if echo "$TOKEN_INFO" | grep -q "subscriptionId"; then
            echo "✅ Token is valid, proceeding with REST API authentication"
            export AZURE_HTTP_USER_AGENT="GitHubActions"
            
            # Configure az cli to use the token
            az configure --defaults group="${{ secrets.AZURE_RESOURCE_GROUP }}"
          else
            echo "❌ Authentication failed"
            exit 1
          fi
        }
        
        echo "✅ Azure authentication configured"
    
    - name: Deploy Scripts Using Azure CLI
      run: |
        echo "🚀 Deploying scripts using Azure CLI..."
        
        # Override authentication for az automation commands
        export AZURE_ACCESS_TOKEN="${{ secrets.AZURE_ACCESS_TOKEN }}"
        
        success_count=0
        total_count=0
        
        for script in scripts/*.ps1; do
          if [[ -f "$script" ]]; then
            total_count=$((total_count + 1))
            name=$(basename "$script" .ps1)
            echo ""
            echo "📦 [$total_count] Deploying: $name"
            
            # Step 1: Clean up existing runbook
            echo "   🗑️ Removing existing runbook..."
            az automation runbook delete \
              --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$name" --yes 2>/dev/null && echo "   ✅ Old runbook removed" || echo "   ℹ️ No existing runbook"
            
            sleep 2
            
            # Step 2: Create new runbook
            echo "   🆕 Creating new runbook..."
            if az automation runbook create \
              --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$name" \
              --type PowerShell \
              --description "Auto-deployed from GitHub on $(date) - Commit: ${GITHUB_SHA:0:7}" >/dev/null; then
              echo "   ✅ Runbook created successfully"
            else
              echo "   ❌ Failed to create runbook, trying with token auth..."
              
              # Fallback: Use direct REST API
              curl -s -X PUT \
                "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Automation/automationAccounts/${{ secrets.AZURE_AUTOMATION_ACCOUNT }}/runbooks/$name?api-version=2020-01-13-preview" \
                -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d '{"properties":{"runbookType":"PowerShell","description":"GitHub deployed"},"location":"East US"}' >/dev/null
              
              echo "   ✅ Runbook created via REST API"
            fi
            
            sleep 3
            
            # Step 3: Upload content
            echo "   📤 Uploading script content..."
            if az automation runbook replace-content \
              --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$name" \
              --content "@$script" >/dev/null; then
              echo "   ✅ Content uploaded successfully"
            else
              echo "   ❌ Upload failed via CLI, trying REST API..."
              
              # Fallback: Direct content upload
              curl -s -X PUT \
                "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Automation/automationAccounts/${{ secrets.AZURE_AUTOMATION_ACCOUNT }}/runbooks/$name/draft/content?api-version=2015-10-31" \
                -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}" \
                -H "Content-Type: text/powershell" \
                --data-binary "@$script" >/dev/null
              
              echo "   ✅ Content uploaded via REST API"
            fi
            
            sleep 5
            
            # Step 4: Publish runbook
            echo "   📢 Publishing runbook..."
            if az automation runbook publish \
              --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$name" >/dev/null; then
              echo "   🎉 PUBLISHED SUCCESSFULLY!"
              success_count=$((success_count + 1))
            else
              echo "   ⚠️ CLI publish failed, trying REST API..."
              
              # Fallback: REST API publish (may still fail)
              publish_result=$(curl -s -w "%{http_code}" -X POST \
                "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Automation/automationAccounts/${{ secrets.AZURE_AUTOMATION_ACCOUNT }}/runbooks/$name/publish?api-version=2015-10-31" \
                -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}")
              
              status="${publish_result: -3}"
              if [[ "$status" == "200" || "$status" == "202" ]]; then
                echo "   🎉 Published via REST API!"
                success_count=$((success_count + 1))
              else
                echo "   ❌ Auto-publish failed - manual publish needed"
              fi
            fi
            
            # Step 5: Verify final state
            echo "   🔍 Verifying final state..."
            sleep 2
            
            final_state=$(az automation runbook show \
              --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$name" \
              --query "state" -o tsv 2>/dev/null || echo "Unknown")
            
            if [[ "$final_state" == "Published" ]]; then
              echo "   ✅ SUCCESS: $name is LIVE and ready!"
            else
              echo "   ⚠️ Final state: $final_state - may need manual publish"
            fi
          fi
        done
        
        echo ""
        echo "🎯 ===== DEPLOYMENT SUMMARY ====="
        echo "📁 Total scripts: $total_count"
        echo "🎉 Successfully published: $success_count"
        echo "📋 Manual publish needed: $((total_count - success_count))"
        
        if [[ $success_count -eq $total_count && $total_count -gt 0 ]]; then
          echo ""
          echo "✅ PERFECT! All scripts deployed and published!"
          echo "🚀 Ready for Logic App immediately!"
        elif [[ $success_count -gt 0 ]]; then
          echo ""
          echo "✅ PARTIAL SUCCESS: $success_count/$total_count scripts published"
          echo "📋 Manual publish needed for remaining scripts"
        fi
    
    - name: List Final Runbook States
      run: |
        echo "📋 Final verification of all runbooks..."
        
        az automation runbook list \
          --automation-account-name "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}" \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --query "[?contains(name,'myscript')].{Name:name,State:state,Type:runbookType,LastModified:lastModifiedTime}" \
          --output table 2>/dev/null || {
          
          # Fallback: REST API verification
          echo "Using REST API for verification..."
          curl -s \
            "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Automation/automationAccounts/${{ secrets.AZURE_AUTOMATION_ACCOUNT }}/runbooks?api-version=2020-01-13-preview" \
            -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}" | \
            jq -r '.value[] | select(.name | contains("myscript")) | "Name: \(.name) | State: \(.properties.state) | Type: \(.properties.runbookType)"' 2>/dev/null || echo "Manual verification needed"
        }
