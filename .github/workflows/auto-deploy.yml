name: Deploy Scripts to Azure (Token Auth Fixed)

on:
  push:
    branches: [ main ]
    paths: [ 'scripts/**' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Get code
      uses: actions/checkout@v4
    
    - name: Install Azure CLI
      run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    
    - name: Setup Azure Authentication
      run: |
        echo "🔐 Setting up Azure CLI with existing token..."
        
        # Create a fake Azure CLI profile with your token
        mkdir -p ~/.azure
        
        # Create azureProfile.json
        cat > ~/.azure/azureProfile.json << EOF
        {
          "installationId": "github-actions",
          "subscriptions": [
            {
              "id": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "name": "Your Subscription",
              "state": "Enabled",
              "user": {
                "name": "github-actions@automation",
                "type": "user"
              },
              "isDefault": true,
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }
          ]
        }
        EOF
        
        # Create accessTokens.json with your token
        cat > ~/.azure/accessTokens.json << EOF
        [
          {
            "tokenType": "Bearer",
            "accessToken": "${{ secrets.AZURE_ACCESS_TOKEN }}",
            "expiresOn": "$(date -d '+1 hour' --iso-8601=seconds)",
            "subscription": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenant": "${{ secrets.AZURE_TENANT_ID }}"
          }
        ]
        EOF
        
        # Set the default subscription
        az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        
        echo "✅ Azure CLI configured with token"
    
    - name: Deploy PowerShell Scripts
      run: |
        echo "🚀 Deploying scripts with your proven method..."
        
        for script in scripts/*.ps1; do
          if [[ -f "$script" ]]; then
            name=$(basename "$script" .ps1)
            echo "📦 Deploying: $name"
            
            # Delete old runbook
            az automation runbook delete \
              --automation-account-name ${{ secrets.AZURE_AUTOMATION_ACCOUNT }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name "$name" --yes 2>/dev/null || echo "No existing runbook"
            
            # Create new runbook
            az automation runbook create \
              --automation-account-name ${{ secrets.AZURE_AUTOMATION_ACCOUNT }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name "$name" \
              --type PowerShell \
              --description "Auto-deployed from GitHub"
            
            # Upload content
            az automation runbook replace-content \
              --automation-account-name ${{ secrets.AZURE_AUTOMATION_ACCOUNT }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name "$name" \
              --content "@$script"
            
            # Publish
            az automation runbook publish \
              --automation-account-name ${{ secrets.AZURE_AUTOMATION_ACCOUNT }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name "$name"
            
            echo "✅ Successfully deployed and published: $name"
          fi
        done
        
        echo "🎉 All scripts deployed and published!"
