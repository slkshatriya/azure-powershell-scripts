name: Auto Deploy to Azure

on:
  push:
    branches: [ main ]
    paths: [ 'scripts/**' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy Scripts to Azure Automation
      run: |
        echo "Deploying scripts to Azure..."
        
        # Deploy each PowerShell script
        for script_file in scripts/*.ps1; do
          if [[ -f "$script_file" ]]; then
            runbook_name=$(basename "$script_file" .ps1)
            echo "Deploying: $runbook_name"
            
            # Step 1: Create runbook
            curl -s -X PUT \
              "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Automation/automationAccounts/${{ secrets.AZURE_AUTOMATION_ACCOUNT }}/runbooks/${runbook_name}?api-version=2020-01-13-preview" \
              -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{
                "properties": {
                  "runbookType": "PowerShell",
                  "description": "Auto-deployed from GitHub"
                }
              }'
            
            # Step 2: Upload script content
            curl -s -X PUT \
              "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Automation/automationAccounts/${{ secrets.AZURE_AUTOMATION_ACCOUNT }}/runbooks/${runbook_name}/draft/content?api-version=2015-10-31" \
              -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}" \
              -H "Content-Type: text/powershell" \
              --data-binary "@${script_file}"
            
            # Step 3: Publish runbook
            curl -s -X POST \
              "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Automation/automationAccounts/${{ secrets.AZURE_AUTOMATION_ACCOUNT }}/runbooks/${runbook_name}/publish?api-version=2015-10-31" \
              -H "Authorization: Bearer ${{ secrets.AZURE_ACCESS_TOKEN }}"
            
            echo "Deployed: $runbook_name"
          fi
        done
        
        echo "All scripts deployed!"
