name: Deploy with PowerShell (Direct Method)

on:
  push:
    branches: [ main ]
    paths: [ 'scripts/**' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy and Publish with PowerShell
      shell: pwsh
      run: |
        Write-Host "🚀 Deploying with PowerShell REST API..." -ForegroundColor Green
        
        $subscriptionId = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        $resourceGroup = "${{ secrets.AZURE_RESOURCE_GROUP }}"
        $automationAccount = "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}"
        $accessToken = "${{ secrets.AZURE_ACCESS_TOKEN }}"
        
        $headers = @{
            'Authorization' = "Bearer $accessToken"
            'Content-Type' = 'application/json'
        }
        
        $baseUri = "https://management.azure.com/subscriptions/$subscriptionId/resourceGroups/$resourceGroup/providers/Microsoft.Automation/automationAccounts/$automationAccount"
        
        # Get all PowerShell scripts
        $scripts = Get-ChildItem -Path "scripts\*.ps1"
        $successCount = 0
        
        foreach ($script in $scripts) {
            $runbookName = $script.BaseName
            $scriptContent = Get-Content $script.FullName -Raw
            
            Write-Host "📦 Processing: $runbookName" -ForegroundColor Yellow
            
            try {
                # Step 1: Delete existing runbook
                Write-Host "   🗑️ Removing existing runbook..." -ForegroundColor Cyan
                $deleteUri = "$baseUri/runbooks/$runbookName" + "?api-version=2020-01-13-preview"
                try {
                    Invoke-RestMethod -Uri $deleteUri -Method DELETE -Headers $headers -ErrorAction SilentlyContinue
                } catch {
                    Write-Host "   ℹ️ No existing runbook to delete" -ForegroundColor Gray
                }
                Start-Sleep 2
                
                # Step 2: Create new runbook
                Write-Host "   🆕 Creating new runbook..." -ForegroundColor Cyan
                $createUri = "$baseUri/runbooks/$runbookName" + "?api-version=2020-01-13-preview"
                $createBody = @{
                    properties = @{
                        runbookType = "PowerShell"
                        description = "Auto-deployed from GitHub on $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                        logVerbose = $false
                        logProgress = $false
                    }
                    location = "East US"
                } | ConvertTo-Json -Depth 3
                
                $createResult = Invoke-RestMethod -Uri $createUri -Method PUT -Body $createBody -Headers $headers
                Write-Host "   ✅ Runbook created successfully" -ForegroundColor Green
                Start-Sleep 3
                
                # Step 3: Upload script content
                Write-Host "   📤 Uploading script content..." -ForegroundColor Cyan
                $contentUri = "$baseUri/runbooks/$runbookName/draft/content" + "?api-version=2015-10-31"
                $contentHeaders = @{
                    'Authorization' = "Bearer $accessToken"
                    'Content-Type' = 'text/powershell'
                }
                
                $uploadResult = Invoke-RestMethod -Uri $contentUri -Method PUT -Body $scriptContent -Headers $contentHeaders
                Write-Host "   ✅ Content uploaded successfully" -ForegroundColor Green
                Start-Sleep 5
                
                # Step 4: Check current state
                Write-Host "   🔍 Checking runbook state..." -ForegroundColor Cyan
                $statusUri = "$baseUri/runbooks/$runbookName" + "?api-version=2020-01-13-preview"
                $statusResult = Invoke-RestMethod -Uri $statusUri -Method GET -Headers $headers
                $currentState = $statusResult.properties.state
                Write-Host "   📊 Current state: $currentState" -ForegroundColor Gray
                
                # Step 5: Publish runbook
                Write-Host "   📢 Publishing runbook..." -ForegroundColor Cyan
                $publishUri = "$baseUri/runbooks/$runbookName/publish" + "?api-version=2015-10-31"
                $publishHeaders = @{
                    'Authorization' = "Bearer $accessToken"
                    'Content-Length' = '0'
                }
                
                $publishAttempts = 0
                $published = $false
                
                while ($publishAttempts -lt 3 -and -not $published) {
                    $publishAttempts++
                    Write-Host "   🔄 Publish attempt $publishAttempts/3..." -ForegroundColor Cyan
                    
                    try {
                        $publishResult = Invoke-RestMethod -Uri $publishUri -Method POST -Headers $publishHeaders
                        Write-Host "   🎉 PUBLISHED SUCCESSFULLY!" -ForegroundColor Green
                        $published = $true
                        $successCount++
                    }
                    catch {
                        Write-Host "   ⚠️ Publish attempt $publishAttempts failed: $($_.Exception.Message)" -ForegroundColor Yellow
                        if ($publishAttempts -lt 3) {
                            Write-Host "   ⏳ Waiting 10 seconds before retry..." -ForegroundColor Gray
                            Start-Sleep 10
                        }
                    }
                }
                
                if (-not $published) {
                    Write-Host "   ❌ All publish attempts failed - manual publish needed" -ForegroundColor Red
                }
                
                # Step 6: Verify final state
                Start-Sleep 3
                $finalStatus = Invoke-RestMethod -Uri $statusUri -Method GET -Headers $headers
                $finalState = $finalStatus.properties.state
                Write-Host "   ✅ Final state: $finalState" -ForegroundColor $(if($finalState -eq "Published") {"Green"} else {"Yellow"})
                
            }
            catch {
                Write-Host "   ❌ ERROR processing $runbookName`: $($_.Exception.Message)" -ForegroundColor Red
            }
            
            Write-Host "" # Empty line for readability
        }
        
        # Summary
        Write-Host "🎯 ===== DEPLOYMENT SUMMARY =====" -ForegroundColor Magenta
        Write-Host "📁 Total scripts processed: $($scripts.Count)" -ForegroundColor White
        Write-Host "🎉 Successfully published: $successCount" -ForegroundColor Green
        Write-Host "📋 Manual publish needed: $($scripts.Count - $successCount)" -ForegroundColor Yellow
        
        if ($successCount -eq $scripts.Count -and $scripts.Count -gt 0) {
            Write-Host "" 
            Write-Host "✅ PERFECT! All scripts are LIVE and ready!" -ForegroundColor Green
            Write-Host "🚀 Your Logic App can use them immediately!" -ForegroundColor Green
        }
        elseif ($successCount -gt 0) {
            Write-Host ""
            Write-Host "✅ PARTIAL SUCCESS! Some scripts are published." -ForegroundColor Yellow
            Write-Host "📋 Manual publish needed in Azure Portal for remaining scripts" -ForegroundColor Yellow
        }
        else {
            Write-Host ""
            Write-Host "📤 Scripts uploaded but auto-publish failed" -ForegroundColor Yellow
            Write-Host "📋 Manual publish required: Azure Portal → Automation Account → Runbooks" -ForegroundColor Yellow
        }
        
        Write-Host ""
        Write-Host "🔗 Azure Portal: https://portal.azure.com" -ForegroundColor Cyan
        Write-Host "📂 Navigate to: Automation Accounts → $automationAccount → Runbooks" -ForegroundColor Cyan
    
    - name: Verify Deployment
      shell: pwsh
      run: |
        Write-Host "🔍 Verifying deployment..." -ForegroundColor Green
        
        $accessToken = "${{ secrets.AZURE_ACCESS_TOKEN }}"
        $subscriptionId = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        $resourceGroup = "${{ secrets.AZURE_RESOURCE_GROUP }}"
        $automationAccount = "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}"
        
        $headers = @{
            'Authorization' = "Bearer $accessToken"
        }
        
        $listUri = "https://management.azure.com/subscriptions/$subscriptionId/resourceGroups/$resourceGroup/providers/Microsoft.Automation/automationAccounts/$automationAccount/runbooks?api-version=2020-01-13-preview"
        
        try {
            $runbooks = Invoke-RestMethod -Uri $listUri -Method GET -Headers $headers
            
            Write-Host "📋 Current runbooks in automation account:" -ForegroundColor Cyan
            Write-Host "Name`t`tState`t`tType" -ForegroundColor Gray
            Write-Host "----`t`t-----`t`t----" -ForegroundColor Gray
            
            foreach ($runbook in $runbooks.value) {
                $state = $runbook.properties.state
                $color = if ($state -eq "Published") { "Green" } else { "Yellow" }
                Write-Host "$($runbook.name)`t`t$state`t`t$($runbook.properties.runbookType)" -ForegroundColor $color
            }
        }
        catch {
            Write-Host "❌ Could not retrieve runbook list: $($_.Exception.Message)" -ForegroundColor Red
            Write-Host "📋 Please check manually in Azure Portal" -ForegroundColor Yellow
        }
