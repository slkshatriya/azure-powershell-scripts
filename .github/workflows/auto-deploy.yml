name: Deploy with PowerShell (Most Reliable)

on:
  push:
    branches: [ main ]
    paths: [ 'scripts/**' ]

jobs:
  deploy:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy using PowerShell
      shell: pwsh
      run: |
        Write-Host "🚀 Deploying with PowerShell..." -ForegroundColor Green
        
        # Install required modules
        Install-Module -Name Az.Automation -Force -Scope CurrentUser
        Import-Module Az.Automation
        
        $subscriptionId = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        $resourceGroup = "${{ secrets.AZURE_RESOURCE_GROUP }}"
        $automationAccount = "${{ secrets.AZURE_AUTOMATION_ACCOUNT }}"
        $accessToken = "${{ secrets.AZURE_ACCESS_TOKEN }}"
        
        # Create auth context
        $context = [Microsoft.Azure.Commands.Common.Authentication.Abstractions.AzureRmProfileProvider]::Instance.Profile.DefaultContext
        $context.Account.SetProperty("AccessToken", $accessToken)
        
        Get-ChildItem -Path "scripts/*.ps1" | ForEach-Object {
            $runbookName = $_.BaseName
            $scriptPath = $_.FullName
            
            Write-Host "📦 Processing: $runbookName" -ForegroundColor Yellow
            
            try {
                # Remove existing runbook
                Write-Host "   🗑️ Removing existing..." -ForegroundColor Cyan
                Remove-AzAutomationRunbook -AutomationAccountName $automationAccount -ResourceGroupName $resourceGroup -Name $runbookName -Force -ErrorAction SilentlyContinue
                Start-Sleep 3
                
                # Import new runbook
                Write-Host "   📤 Importing new runbook..." -ForegroundColor Cyan
                Import-AzAutomationRunbook -AutomationAccountName $automationAccount -ResourceGroupName $resourceGroup -Name $runbookName -Type PowerShell -Path $scriptPath -Description "GitHub deployed"
                Start-Sleep 5
                
                # Publish runbook
                Write-Host "   📢 Publishing..." -ForegroundColor Cyan
                Publish-AzAutomationRunbook -AutomationAccountName $automationAccount -ResourceGroupName $resourceGroup -Name $runbookName
                
                Write-Host "   ✅ SUCCESS: $runbookName is published!" -ForegroundColor Green
            }
            catch {
                Write-Host "   ❌ ERROR: $($_.Exception.Message)" -ForegroundColor Red
            }
        }
        
        Write-Host "🎉 Deployment completed!" -ForegroundColor Green
